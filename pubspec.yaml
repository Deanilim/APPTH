name: appth
description: App educativa para niños con autismo y TDAH - Aprende español

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  flutter_animate: ^4.3.0
  audioplayers: ^5.2.1
  lottie: ^2.7.0
  google_fonts: ^6.1.0
  confetti: ^0.7.0
  flutter_tts: ^3.8.5
  shared_preferences: ^2.2.2
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/animations/
